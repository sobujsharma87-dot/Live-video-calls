            if (!currentProfile) return;

            if (!state.inputClickedOnce) {
                e.preventDefault();
                chatInput.blur();
                state.inputClickedOnce = true;

        });

        // Step 3 (Per Profile): 1st click on Send inside this profile's chat -> Direct Link
        const chatSendBtn = document.getElementById("chatSendBtn");
        chatSendBtn.addEventListener("click", handleSendMessage);

                            <p>Got your message! 😊 Give me just a minute, I'm finishing up something and will reply right back.</p>
                            <span class="block text-[9px] text-slate-400 mt-1 text-right">${replyTime}</span>
                        </div>
                    </div>
                `;
                state.messagesHtml += replyHtml;

                if (currentProfile && currentProfile.id === activeProfile.id) {
                    messagesBox.innerHTML = state.messagesHtml;
                    messagesBox.scrollTop = messagesBox.scrollHeight;
                }
            }, 1300);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[m];
            });
        }
    </script>
